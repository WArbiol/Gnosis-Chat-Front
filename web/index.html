<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pergunte à Gnosis - Conhecimento sagrado revelado.">
  <meta name="theme-color" content="#070709">
  <meta name="referrer" content="no-referrer">
  <meta name="google-signin-client_id" content="971574732695-ndhmbf15ocp31buk94kgf5jo0jj3j0rq.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gnosis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pergunte à Gnosis</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    html, body {
      background-color: #070709;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  
  <!-- Scripts do pdf.js exigidos pelo Syncfusion PDF Viewer para rodar na Web -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
  </script>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <div id="g_id_signin_hidden" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;z-index:-1;"></div>
  <script>
    window.renderAndClickGoogleButton = function() {
      try {
        var container = document.getElementById('g_id_signin_hidden');
        if (container && window.google && window.google.accounts && window.google.accounts.id) {
          container.innerHTML = '';
          window.google.accounts.id.renderButton(container, {
            theme: 'outline',
            size: 'large',
            type: 'standard'
          });
          setTimeout(function() {
            var btn = container.querySelector('div[role=button]');
            if (btn) {
              btn.click();
            }
          }, 50);
        }
      } catch (err) {
        console.error('Error triggering GIS button:', err);
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
